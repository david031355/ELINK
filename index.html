<!DOCTYPE html>
<html lang="he" dir="rtl" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINK - מחולל קישורים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
        }
        
        /* עיצוב גלילה מותאם לחלונית העריכה */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
        
        /* עיצוב בר ההתקדמות של הנגן */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: #2563eb; cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .dark input[type=range]::-webkit-slider-thumb { background: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #e2e8f0; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #334155; }
        
        /* כפתור פליי עם מעבר רך */
        .play-btn-transition { transition: all 0.2s ease-in-out; }
        .play-btn-transition:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-gray-900 transition-colors duration-300 relative">

    <!-- Top Action Buttons (Theme & Language) -->
    <div class="absolute top-4 w-full max-w-7xl px-4 flex justify-between left-1/2 -translate-x-1/2 z-10">
        <button onclick="toggleTheme()" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-yellow-400 hover:scale-110 transition-transform focus:outline-none" data-i18n-title="themeToggle">
            <i id="themeIcon" class="fas fa-moon text-xl"></i>
        </button>
        <button onclick="toggleLanguage()" class="py-2 px-4 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-gray-200 hover:scale-105 transition-transform focus:outline-none font-bold text-sm flex items-center gap-2">
            <i class="fas fa-globe"></i>
            <span id="langBtnText">English</span>
        </button>
    </div>

    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full max-w-5xl mt-16 lg:mt-10">
        
        <!-- Main Form Panel -->
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full lg:max-w-lg transition-colors duration-300">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight" data-i18n="appTitle">ELINK</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-2 font-medium" data-i18n="appSubtitle">מחולל הקישורים החכם</p>
            </div>

            <div class="space-y-5">
                <!-- בחירת תוכנית -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectProgramLabel">בחר תוכנית:</label>
                    <div class="flex gap-2">
                        <select id="programSelect" class="flex-1 w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></select>
                        <button onclick="openReorderModal()" class="px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500" data-i18n-title="editOrderBtnTitle" title="שנה סדר רשימה">
                            <i class="fas fa-sort-amount-down"></i>
                        </button>
                    </div>
                </div>

                <!-- בחירת תאריך -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="dateSelect" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectDateLabel">בחר תאריך:</label>
                        <input type="date" id="dateSelect" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label for="partSelect" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="partOptionalLabel">חלק (אופציונלי):</label>
                        <input type="text" id="partSelect" placeholder="למשל: a או b" data-i18n-placeholder="partPlaceholder" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <!-- כפתור יצירה -->
                <button id="generateBtn" onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
                    <i class="fas fa-link"></i> <span data-i18n="generateLinkBtn">הפק קישור</span>
                </button>

                <!-- אזור תוצאה -->
                <div id="resultArea" class="hidden mt-6 space-y-4">
                    
                    <!-- שדה לינק מלא -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedLinkLabel">הקישור שהופק:</label>
                        <div class="relative">
                            <textarea id="output" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm h-24 resize-none focus:outline-none transition-colors" dir="ltr"></textarea>
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="copyOutputField('output', 'copyMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyLinkTitle" title="העתק קישור">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                                <a id="openLinkBtn" href="#" target="_blank" class="text-gray-500 dark:text-gray-400 hover:text-green-600 dark:hover:text-green-400 transition-colors" data-i18n-title="openNewTabTitle" title="פתח בטאב חדש">
                                    <i class="fas fa-external-link-alt text-xl"></i>
                                </a>
                            </div>
                        </div>
                        <div id="copyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copySuccessMsg">הקישור הועתק בהצלחה!</div>
                    </div>

                    <!-- שדה שם קובץ -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedFileNameLabel">שם הקובץ:</label>
                        <div class="relative">
                            <input type="text" id="fileNameOutput" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm focus:outline-none transition-colors" dir="ltr">
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="copyOutputField('fileNameOutput', 'copyFileNameMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyFileNameTitle" title="העתק שם קובץ">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyFileNameMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copyFileNameSuccessMsg">שם הקובץ הועתק בהצלחה!</div>
                    </div>

                    <!-- שדה תאריך משולב -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedDateLabel">יום:</label>
                        <div class="relative">
                            <input type="text" id="combinedDateOutput" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-right font-mono text-sm focus:outline-none transition-colors" dir="rtl">
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="copyOutputField('combinedDateOutput', 'copyCombinedDateMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyDateTitle" title="העתק יום">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyCombinedDateMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copyDateSuccessMsg">היום הועתק בהצלחה!</div>
                    </div>

                </div>
            </div>
            
            <div class="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs font-medium text-gray-400 dark:text-gray-500 italic tracking-wider">
                    Written specially for Eli from Monsey
                </p>
            </div>
        </div>

        <!-- Side Panels Column (Quick Copy + Player) -->
        <div class="flex flex-col gap-6 w-full lg:w-72 self-start">
            
            <!-- Quick Copy Side Panel (Collapsible) -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full transition-colors duration-300">
                <button onclick="toggleQuickCopy()" class="w-full flex justify-between items-center p-6 bg-transparent focus:outline-none group">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="quickCopyTitle">העתקה מהירה</h3>
                    <i id="quickCopyChevron" class="fas fa-chevron-down text-gray-500 dark:text-gray-400 transition-transform duration-300"></i>
                </button>
                
                <div id="quickCopyContent" class="hidden px-6 pb-6 pt-0 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex flex-col gap-3 mt-4" id="quickCopyButtonsContainer">
                        <!-- Buttons initialized via JS for cleanliness -->
                    </div>
                    <div id="quickCopyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-4 hidden text-center" data-i18n="quickCopySuccessMsg">הטקסט הועתק בהצלחה!</div>
                </div>
            </div>

            <!-- Audio Player Panel (Custom Design) -->
            <div id="playerPanel" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full p-6 transition-colors duration-300 hidden">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-5 text-center border-b border-gray-200 dark:border-gray-700 pb-3" data-i18n="audioPlayerTitle">האזנה להקלטה</h3>
                
                <audio id="audioElement" preload="metadata">
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>

                <div class="flex flex-col items-center gap-4 mt-2">
                    <button id="playPauseBtn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg play-btn-transition focus:outline-none focus:ring-4 focus:ring-blue-500/50">
                        <i id="playIcon" class="fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1"></i>
                    </button>
                    
                    <div class="w-full flex flex-col gap-2">
                        <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full focus:outline-none">
                        <div class="flex justify-between w-full text-xs font-semibold text-gray-500 dark:text-gray-400 font-mono" dir="ltr">
                            <span id="currentTimeDisplay">00:00</span>
                            <span id="durationDisplay">00:00</span>
                        </div>
                    </div>

                    <div class="w-full flex items-center justify-between mt-1">
                        <button onclick="toggleMute()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors focus:outline-none p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i id="muteIcon" class="fas fa-volume-up text-lg"></i>
                        </button>
                        <div id="playingWaves" class="flex gap-1 items-end h-4 opacity-0 transition-opacity">
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite] h-full"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.2s] h-3/4"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.4s] h-full"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal לסידור הרשימה -->
    <div id="reorderModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col transform scale-95 transition-transform duration-300" style="max-height: 85vh;">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="reorderTitle">סידור רשימת התוכניות</h3>
                <button onclick="closeReorderModal()" class="text-gray-400 hover:text-red-500 transition-colors focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar bg-gray-100 dark:bg-gray-900" id="reorderList"></div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-between gap-3 bg-white dark:bg-gray-800">
                <button onclick="resetOrder()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors border border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-400 dark:hover:border-blue-500" data-i18n="reorderResetBtn">שחזר ברירת מחדל</button>
                <div class="flex gap-2">
                    <button onclick="closeReorderModal()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg transition-colors" data-i18n="reorderCancelBtn">ביטול</button>
                    <button onclick="saveOrder()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-md" data-i18n="reorderSaveBtn">שמור שינויים</button>
                </div>
            </div>
        </div>
    </div>

        function safeGetStorage(key, defaultVal) {
            try { return localStorage.getItem(key) || defaultVal; } 
            catch (e) { return defaultVal; }
        }
        function safeSetStorage(key, val) {
            try { localStorage.setItem(key, val); } 
            catch (e) {}
        }

        let currentLang = safeGetStorage('app_lang', 'he');
        let currentOrder = [];

        function initApp() {
            initOrder();
            initTheme();
            initLanguage();
            renderQuickCopyButtons();
        }

        function initOrder() {
            const saved = safeGetStorage('app_programs_order', null);
            if (saved) {
                try {
                    currentOrder = JSON.parse(saved);
                    programsData.forEach(p => { if (!currentOrder.includes(p.id)) currentOrder.push(p.id); });
                    currentOrder = currentOrder.filter(id => programsData.some(p => p.id === id));
                } catch(e) { currentOrder = programsData.map(p => p.id); }
            } else {
                currentOrder = programsData.map(p => p.id);
            }
        }

        function initTheme() {
            const savedTheme = safeGetStorage('theme', '');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                safeSetStorage('theme', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                html.classList.add('dark');
                safeSetStorage('theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'he' ? 'en' : 'he';
            safeSetStorage('app_lang', currentLang);
            applyLanguage(currentLang);
        }

        function applyLanguage(lang) {
            const doc = document.documentElement;
            doc.lang = lang;
            doc.dir = lang === 'he' ? 'rtl' : 'ltr';
            const t = i18n[lang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (t[el.getAttribute('data-i18n')]) el.textContent = t[el.getAttribute('data-i18n')];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                if (t[el.getAttribute('data-i18n-placeholder')]) el.placeholder = t[el.getAttribute('data-i18n-placeholder')];
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                if (t[el.getAttribute('data-i18n-title')]) el.title = t[el.getAttribute('data-i18n-title')];
            });

            document.getElementById('langBtnText').textContent = t.langBtnText;
            document.title = t.appTitle + " - " + (lang === 'he' ? "מחולל קישורים" : "Link Generator");
        }

        function initLanguage() {
            populateSelect();
            applyLanguage(currentLang);
        }

        function populateSelect() {
            const select = document.getElementById('programSelect');
            const savedVal = select.value;
            select.innerHTML = `<option value="" disabled selected data-i18n="selectProgramPlaceholder">-- בחר מרשימת התוכניות --</option>`;
            
            currentOrder.forEach(id => {
                const prog = programsData.find(p => p.id === id);
                if (prog) {
                    const opt = document.createElement('option');
                    opt.value = prog.value;
                    opt.setAttribute('data-i18n', prog.id);
                    select.appendChild(opt);
                }
            });
            if (savedVal) select.value = savedVal;
        }

        let tempOrder = [];
        function openReorderModal() {
            tempOrder = [...currentOrder];
            renderReorderList();
            const modal = document.getElementById('reorderModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeReorderModal() {
            const modal = document.getElementById('reorderModal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderReorderList() {
            const listEl = document.getElementById('reorderList');
            listEl.innerHTML = '';
            tempOrder.forEach((id, index) => {
                const prog = programsData.find(p => p.id === id);
                if(!prog) return;
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 transition-all";
                div.innerHTML = `
                    <span class="text-gray-800 dark:text-gray-200 font-medium text-sm flex-1 ml-2 rtl:ml-0 rtl:mr-2" data-i18n="${prog.id}">${i18n[currentLang][prog.id]}</span>
                    <div class="flex gap-1">
                        <button onclick="moveItem(${index}, -1)" class="${index === 0 ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-700'} w-8 h-8 flex items-center justify-center rounded-md transition-colors focus:outline-none" ${index === 0 ? 'disabled' : ''}><i class="fas fa-arrow-up"></i></button>
                        <button onclick="moveItem(${index}, 1)" class="${index === tempOrder.length - 1 ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-700'} w-8 h-8 flex items-center justify-center rounded-md transition-colors focus:outline-none" ${index === tempOrder.length - 1 ? 'disabled' : ''}><i class="fas fa-arrow-down"></i></button>
                    </div>`;
                listEl.appendChild(div);
            });
        }

        function moveItem(index, direction) {
            if (index + direction < 0 || index + direction >= tempOrder.length) return;
            const temp = tempOrder[index];
            tempOrder[index] = tempOrder[index + direction];
            tempOrder[index + direction] = temp;
            renderReorderList();
        }

        function saveOrder() {
            currentOrder = [...tempOrder];
            safeSetStorage('app_programs_order', JSON.stringify(currentOrder));
            initLanguage();
            closeReorderModal();
        }

        function resetOrder() {
            if(confirm(currentLang === 'he' ? "האם אתה בטוח שברצונך לשחזר את הרשימה למצבה המקורי?" : "Are you sure you want to reset the list to its original order?")) {
                tempOrder = programsData.map(p => p.id);
                renderReorderList();
            }
        }

        function toggleQuickCopy() {
            const content = document.getElementById('quickCopyContent');
            const chevron = document.getElementById('quickCopyChevron');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function renderQuickCopyButtons() {
            const container = document.getElementById('quickCopyButtonsContainer');
            const keys = ['qcDay1', 'qcDay2', 'qcDay3', 'qcDay4', 'qcDay5', 'qcErevShabbat', 'qcMotash'];
            
            container.innerHTML = keys.map(key => `
                <button onclick="executeCopyText(this.querySelector('span').innerText, 'quickCopyMsg')" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                    <span data-i18n="${key}"></span>
                    <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                </button>
            `).join('');
            // Apply language to newly rendered buttons
            applyLanguage(currentLang);
        }

        function executeCopyText(textToCopy, msgElementId) {
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand("copy");
                const msg = document.getElementById(msgElementId);
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } catch (err) {
                alert(i18n[currentLang].alertCopyFail);
            }
            document.body.removeChild(tempInput);
        }

        function copyOutputField(inputId, msgId) {
            const field = document.getElementById(inputId);
            executeCopyText(field.value, msgId);
        }

        async function fetchHebcalYear(year, month, day) {
            try {
                const url = `https://www.hebcal.com/converter?cfg=json&gy=${year}&gm=${month}&gd=${day}&g2h=1`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.hebrew) {
                    const cleanDate = data.hebrew.replace(/[\u0591-\u05C7]/g, '');
                    const words = cleanDate.split(' ');
                    return words[words.length - 1]; // e.g. "תשפ״ו"
                }
            } catch (e) {
                console.error("Hebcal API error:", e);
            }
            return "";
        }

        async function fetchHebcalParasha(dateObj, dayIndex) {
            try {
                const saturdayDate = new Date(dateObj);
                // Forward to upcoming Saturday
                saturdayDate.setDate(dateObj.getDate() + (6 - dayIndex)); 
                const satYear = saturdayDate.getFullYear();
                const satMonth = saturdayDate.getMonth() + 1;
                const satDay = saturdayDate.getDate();
                
                const satDateString = `${satYear}-${String(satMonth).padStart(2, '0')}-${String(satDay).padStart(2, '0')}`;
                const url = `https://www.hebcal.com/hebcal?v=1&cfg=json&gy=${satYear}&gm=${satMonth}&s=on&lg=h`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                if (data && data.items) {
                    const itemsOnSat = data.items.filter(i => i.date === satDateString);
                    const parashaItem = itemsOnSat.find(i => i.category === 'parashat');
                    const specialShabbat = itemsOnSat.find(i => i.hebrew && i.hebrew.startsWith('שבת ') && !i.hebrew.includes('מבָרְכִים'));
                    
                    let pName = parashaItem ? parashaItem.hebrew.replace(/[\u0591-\u05C7]/g, '') : "";
                    let sName = specialShabbat ? specialShabbat.hebrew.replace(/[\u0591-\u05C7]/g, '') : "";

                    // If Friday/Saturday and there's a special shabbat (e.g. Shabbat HaGadol), prefer it.
                    if ((dayIndex === 5 || dayIndex === 6) && sName) {
                        return sName.replace("שבת ", ""); 
                    } else if (pName) {
                        return pName.startsWith("פרשת ") ? pName : "פרשת " + pName;
                    }
                }
            } catch (err) {
                console.error("Parasha API error:", err);
            }
            return "";
        }

        async function generateLink() {
            const programSelect = document.getElementById('programSelect').value;
            const dateVal = document.getElementById('dateSelect').value;
            const partVal = document.getElementById('partSelect').value.trim().toLowerCase();
            const btn = document.getElementById('generateBtn');
            const originalBtnHtml = btn.innerHTML;
            
            if (!programSelect) return alert(i18n[currentLang].alertNoProgram);
            if (!dateVal) return alert(i18n[currentLang].alertNoDate);

            // Loading state
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${i18n[currentLang].generateLinkLoading}</span>`;
            btn.disabled = true;

            try {
                // 1. Data Prep
                const programData = JSON.parse(programSelect);
                const [year, month, day] = dateVal.split('-');
                const yInt = parseInt(year), mInt = parseInt(month), dInt = parseInt(day);
                const dateObj = new Date(yInt, mInt - 1, dInt);
                const dayIndex = dateObj.getDay();

                // 2. Base Filename & URLs
                const fileYear = programData.yearLen === 2 ? year.slice(-2) : year;
                const baseFileName = `${programData.prefix}${day}-${month}-${fileYear}${partVal}`;
                const relativeLink = `/upload/mp3/${programData.type}/${programData.folder}/${year}/${month}/${baseFileName}.mp3`;
                const fullLink = `https://media.kcm.fm${relativeLink}`;

                // 3. Concurrent API Fetches
                const [hebrewYearStr, parashaName] = await Promise.all([
                    fetchHebcalYear(yInt, mInt, dInt),
                    fetchHebcalParasha(dateObj, dayIndex)
                ]);

                // 4. Construct Day String
                const daysPrefixes = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "ערב שבת", "מוצאי שבת"];
                let finalDayStr = daysPrefixes[dayIndex];
                if (parashaName) finalDayStr += ` ${parashaName}`;
                if (hebrewYearStr) finalDayStr += ` ${hebrewYearStr}`;

                // 5. Update UI
                updateResultFields(relativeLink, baseFileName, finalDayStr, fullLink);
                resetAndLoadAudioPlayer(fullLink);
                
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        }

        function updateResultFields(relativeLink, baseFileName, combinedDate, fullLink) {
            document.getElementById('output').value = relativeLink;
            document.getElementById('fileNameOutput').value = baseFileName;
            document.getElementById('combinedDateOutput').value = combinedDate;
            document.getElementById('openLinkBtn').href = fullLink;
            
            document.getElementById('resultArea').classList.remove('hidden');
            
            // Hide any lingering copy messages
            document.getElementById('copyMsg').classList.add('hidden');
            document.getElementById('copyFileNameMsg').classList.add('hidden');
            document.getElementById('copyCombinedDateMsg').classList.add('hidden');
        }

        function resetAndLoadAudioPlayer(fullLink) {
            const audioSource = document.getElementById('audioSource');
            const audioElement = document.getElementById('audioElement');
            const playIcon = document.getElementById('playIcon');
            const playingWaves = document.getElementById('playingWaves');
            const progressBar = document.getElementById('progressBar');
            
            audioSource.src = fullLink;
            audioElement.load();
            
            document.getElementById('playerPanel').classList.remove('hidden');
            
            playIcon.classList.replace('fa-pause', 'fa-play');
            playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
            playingWaves.classList.add('opacity-0');
            progressBar.value = 0;
            progressBar.style.background = 'transparent';
            document.getElementById('currentTimeDisplay').innerText = "00:00";
            document.getElementById('durationDisplay').innerText = "--:--";
        }

        const audio = document.getElementById('audioElement');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');
        const muteIcon = document.getElementById('muteIcon');
        const playingWaves = document.getElementById('playingWaves');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            progressBar.max = audio.duration;
            durationDisplay.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            progressBar.value = audio.currentTime;
            currentTimeDisplay.innerText = formatTime(audio.currentTime);
            const percentage = (audio.currentTime / audio.duration) * 100;
            const bgLight = document.documentElement.classList.contains('dark') ? '#334155' : '#e2e8f0';
            const bgFill = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
            progressBar.style.background = `linear-gradient(to right, ${bgFill} ${percentage}%, ${bgLight} ${percentage}%)`;
        });

        progressBar.addEventListener('input', () => {
            audio.currentTime = progressBar.value;
            currentTimeDisplay.innerText = formatTime(progressBar.value);
        });

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.classList.remove('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                playingWaves.classList.remove('opacity-0');
            } else {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                playingWaves.classList.add('opacity-0');
            }
        }

        audio.addEventListener('ended', () => {
            playIcon.classList.replace('fa-pause', 'fa-play');
            playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
            playingWaves.classList.add('opacity-0');
            progressBar.value = 0;
            audio.currentTime = 0;
            progressBar.style.background = 'transparent';
        });

        function toggleMute() {
            audio.muted = !audio.muted;
            if (audio.muted) {
                muteIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
                muteIcon.classList.add('text-red-500');
            } else {
                muteIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
                muteIcon.classList.remove('text-red-500');
            }
        }

        // Initialize Everything
        initApp();
    </script>
