<!DOCTYPE html>
<html lang="he" dir="rtl" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINK - מחולל קישורים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
        body { font-family: 'Heebo', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: #2563eb; cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .dark input[type=range]::-webkit-slider-thumb { background: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #e2e8f0; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #334155; }
        
        .play-btn-transition { transition: all 0.2s ease-in-out; }
        .play-btn-transition:active { transform: scale(0.95); }

        .calendar-modal-wrapper {
            display: none;
            position: relative;
            animation: fadeIn 0.25s ease-in-out;
        }
        .calendar-modal-wrapper.open { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            text-align: center;
            font-weight: 600;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            width: 100%;
        }

        .cal-day {
            min-height: 58px;
            min-width: 0;
            padding: 3px 4px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 2px;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .cal-day.empty {
            background: transparent !important;
            border: none !important;
            cursor: default;
        }

        .cal-day.is-shabbat { border-color: #f59e0b; }
        .dark .cal-day.is-shabbat { border-color: #d97706; }

        .cal-day.selected {
            background-color: #2563eb !important;
            border-color: #1d4ed8 !important;
            color: #ffffff !important;
        }
        .cal-day.selected span, .cal-day.selected div { color: #ffffff !important; }

        .cal-holiday-pill, .cal-parasha-pill {
            font-size: 0.65rem;
            border-radius: 3px;
            padding: 1px 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            line-height: 1.2;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-gray-900 transition-colors duration-300 relative">

    <!-- Theme & Language Toggles -->
    <div class="absolute top-4 w-full max-w-7xl px-4 flex justify-between left-1/2 -translate-x-1/2 z-10">
        <button onclick="ThemeService.toggle()" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-yellow-400 hover:scale-110 transition-transform focus:outline-none" data-i18n-title="themeToggle">
            <i id="themeIcon" class="fas fa-moon text-xl"></i>
        </button>
        <button onclick="I18nService.toggle()" class="py-2 px-4 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-gray-200 hover:scale-105 transition-transform focus:outline-none font-bold text-sm flex items-center gap-2">
            <i class="fas fa-globe"></i>
            <span id="langBtnText">English</span>
        </button>
    </div>

    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row gap-8 items-start justify-start w-full max-w-7xl mt-16 lg:mt-10 px-2 sm:px-4">
        
        <!-- Form Panel -->
        <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-xl w-full lg:max-w-3xl flex-1 transition-colors duration-300">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight" data-i18n="appTitle">ELINK</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-2 font-medium" data-i18n="appSubtitle">מחולל הקישורים החכם</p>
            </div>

            <div class="space-y-5">
                <!-- Program Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectProgramLabel">בחר תוכנית:</label>
                    <div class="flex gap-2">
                        <select id="programSelect" class="flex-1 w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></select>
                        <button onclick="ReorderModal.open()" class="px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500" data-i18n-title="editOrderBtnTitle" title="שנה סדר רשימה">
                            <i class="fas fa-sort-amount-down"></i>
                        </button>
                    </div>
                </div>

                <!-- Date Picker & Manual Entry -->
                <div class="space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectDateLabel">בחר תאריך:</label>
                            <div class="flex gap-2">
                                <input type="text" id="typedDateInput" placeholder="DD/MM/YYYY" maxlength="10" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-center font-mono">
                                <button type="button" id="calendarToggleBtn" class="px-4 py-3 bg-blue-50 hover:bg-blue-100 dark:bg-gray-700 dark:hover:bg-gray-600 border border-blue-200 dark:border-gray-600 rounded-lg transition-colors text-blue-600 dark:text-blue-400 font-semibold flex items-center justify-center gap-1 focus:outline-none" title="פתח לוח שנה">
                                    <span id="calendarTriggerText"><i class="fas fa-calendar-alt"></i></span>
                                    <span>▾</span>
                                </button>
                            </div>
                            <input type="hidden" id="dateSelect">
                        </div>

                        <div>
                            <label for="partSelect" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="partOptionalLabel">חלק (אופציונלי):</label>
                            <input type="text" id="partSelect" placeholder="למשל: a או b" data-i18n-placeholder="partPlaceholder" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        </div>
                    </div>

                    <!-- Collapsible Calendar -->
                    <div id="calendarModal" class="calendar-modal-wrapper bg-gray-50 dark:bg-gray-900/80 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-inner mt-2">
                        <div class="flex justify-between items-center bg-gray-200/70 dark:bg-gray-700 text-gray-800 dark:text-white px-3 py-2 rounded-lg font-bold text-sm mb-3">
                            <button id="calPrevMonth" class="px-2 py-1 hover:text-blue-600 dark:hover:text-blue-400 text-base font-bold focus:outline-none">❮</button>
                            <span id="calMonthYearTitle" class="tracking-wide"></span>
                            <button id="calNextMonth" class="px-2 py-1 hover:text-blue-600 dark:hover:text-blue-400 text-base font-bold focus:outline-none">❯</button>
                            <button id="calCloseXBtn" class="text-gray-500 hover:text-red-500 text-sm ml-2 focus:outline-none" title="סגור">✕</button>
                        </div>
                        <div class="cal-weekdays text-gray-500 dark:text-gray-400 text-xs mb-2" dir="ltr">
                            <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div class="text-amber-600 dark:text-amber-400 font-bold">ש'</div>
                        </div>
                        <div class="cal-grid" id="calGrid" dir="ltr"></div>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-200 dark:border-gray-700">
                            <button id="calTodayBtn" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">היום</button>
                            <button id="calClearBtn" class="text-xs text-gray-500 dark:text-gray-400 hover:text-red-500">נקה בחירה</button>
                        </div>
                    </div>
                </div>

                <!-- Generate Button -->
                <button id="generateBtn" onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
                    <i class="fas fa-link"></i> <span data-i18n="generateLinkBtn">הפק קישור</span>
                </button>

                <!-- Results Output Area -->
                <div id="resultArea" class="hidden mt-6 space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedLinkLabel">הקישור שהופק:</label>
                        <div class="relative">
                            <textarea id="output" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm h-24 resize-none focus:outline-none transition-colors" dir="ltr"></textarea>
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="ClipboardService.copyFromInput('output', 'copyMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyLinkTitle" title="העתק קישור">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                                <a id="openLinkBtn" href="#" target="_blank" class="text-gray-500 dark:text-gray-400 hover:text-green-600 dark:hover:text-green-400 transition-colors" data-i18n-title="openNewTabTitle" title="פתח בטאב חדש">
                                    <i class="fas fa-external-link-alt text-xl"></i>
                                </a>
                            </div>
                        </div>
                        <div id="copyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copySuccessMsg">הקישור הועתק בהצלחה!</div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedFileNameLabel">שם הקובץ:</label>
                        <div class="relative">
                            <input type="text" id="fileNameOutput" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm focus:outline-none transition-colors" dir="ltr">
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="ClipboardService.copyFromInput('fileNameOutput', 'copyFileNameMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyFileNameTitle" title="העתק שם קובץ">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyFileNameMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copyFileNameSuccessMsg">שם הקובץ הועתק בהצלחה!</div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedDateLabel">יום:</label>
                        <div class="relative">
                            <input type="text" id="combinedDateOutput" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-right font-mono text-sm focus:outline-none transition-colors" dir="rtl">
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="ClipboardService.copyFromInput('combinedDateOutput', 'copyCombinedDateMsg')" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyDateTitle" title="העתק יום">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyCombinedDateMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-2 hidden text-center" data-i18n="copyDateSuccessMsg">היום הועתק בהצלחה!</div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs font-medium text-gray-400 dark:text-gray-500 italic tracking-wider">
                    Written specially for Eli from Monsey
                </p>
            </div>
        </div>

        <!-- Sidebar Panels -->
        <div class="flex flex-col gap-6 w-full lg:w-80 self-start">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full transition-colors duration-300">
                <button onclick="toggleQuickCopy()" class="w-full flex justify-between items-center p-6 bg-transparent focus:outline-none group">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="quickCopyTitle">העתקה מהירה</h3>
                    <i id="quickCopyChevron" class="fas fa-chevron-down text-gray-500 dark:text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="quickCopyContent" class="hidden px-6 pb-6 pt-0 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex flex-col gap-3 mt-4" id="quickCopyButtonsContainer"></div>
                    <div id="quickCopyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-4 hidden text-center" data-i18n="quickCopySuccessMsg">הטקסט הועתק בהצלחה!</div>
                </div>
            </div>

            <div id="playerPanel" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full p-6 transition-colors duration-300 hidden">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-5 text-center border-b border-gray-200 dark:border-gray-700 pb-3" data-i18n="audioPlayerTitle">האזנה להקלטה</h3>
                
                <audio id="audioElement" preload="metadata">
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>

                <div class="flex flex-col items-center gap-4 mt-2">
                    <button id="playPauseBtn" onclick="AudioModule.togglePlay()" class="w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg play-btn-transition focus:outline-none focus:ring-4 focus:ring-blue-500/50">
                        <i id="playIcon" class="fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1"></i>
                    </button>
                    
                    <div class="w-full flex flex-col gap-2">
                        <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full focus:outline-none">
                        <div class="flex justify-between w-full text-xs font-semibold text-gray-500 dark:text-gray-400 font-mono" dir="ltr">
                            <span id="currentTimeDisplay">00:00</span>
                            <span id="durationDisplay">00:00</span>
                        </div>
                    </div>

                    <div class="w-full flex items-center justify-between mt-1">
                        <button onclick="AudioModule.toggleMute()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors focus:outline-none p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i id="muteIcon" class="fas fa-volume-up text-lg"></i>
                        </button>
                        <div id="playingWaves" class="flex gap-1 items-end h-4 opacity-0 transition-opacity">
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite] h-full"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.2s] h-3/4"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.4s] h-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reorder Programs Modal -->
    <div id="reorderModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col transform scale-95 transition-transform duration-300" style="max-height: 85vh;">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="reorderTitle">סידור רשימת התוכניות</h3>
                <button onclick="ReorderModal.close()" class="text-gray-400 hover:text-red-500 transition-colors focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar bg-gray-100 dark:bg-gray-900" id="reorderList"></div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-between gap-3 bg-white dark:bg-gray-800">
                <button onclick="ReorderModal.reset()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors border border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-400 dark:hover:border-blue-500" data-i18n="reorderResetBtn">שחזר ברירת מחדל</button>
                <div class="flex gap-2">
                    <button onclick="ReorderModal.close()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg transition-colors" data-i18n="reorderCancelBtn">ביטול</button>
                    <button onclick="ReorderModal.save()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-md" data-i18n="reorderSaveBtn">שמור שינויים</button>
                </div>
            </div>
        </div>
    </div>

        const TextHelper = {
            sanitizeHebrew(str) {
                if (!str) return '';
                return str.replace(/[\u0591-\u05C7]/g, '')
                          .replace(/[\u05BE]/g, ' - ')
                          .replace(/\s*-\s*/g, ' - ')
                          .trim();
            },
            formatParasha(pName) {
                if (!pName) return '';
                let s = this.sanitizeHebrew(pName);

                const wordPairs = [
                    ['לך', 'לך'],
                    ['חיי', 'שרה'],
                    ['כי', 'תשא'],
                    ['כי', 'תצא'],
                    ['כי', 'תבוא'],
                    ['שלח', 'לך'],
                    ['וזאת', 'הברכה']
                ];
                for (const [w1, w2] of wordPairs) {
                    s = s.replace(new RegExp(`(${w1})\\s*[-–—]?\\s*(${w2})`, 'g'), '$1 $2');
                }

                const connectedPairs = [
                    ['ויקהל', 'פקודי'],
                    ['תזריע', 'מצורע'],
                    ['אחרי מות', 'קדושים'],
                    ['בהר', 'בחוקתי'],
                    ['חוקת', 'בלק'],
                    ['מטות', 'מסעי'],
                    ['נצבים', 'וילך'],
                    ['ניצבים', 'וילך']
                ];
                for (const [p1, p2] of connectedPairs) {
                    s = s.replace(new RegExp(`(${p1})\\s*[-–—]?\\s*(${p2})`, 'g'), '$1 - $2');
                }

                return s.replace(/\s+/g, ' ').trim();
            }
        };

        const HebcalService = {
            cache: new Map(),
            async getMonthHolidays(year, month) {
                const key = `${year}-${month + 1}`;
                if (this.cache.has(key)) return this.cache.get(key);
                try {
                    const url = `https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&nx=on&s=on&geo=il&year=${year}&month=${month + 1}&lg=he`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error();
                    const data = await res.json();
                    const map = new Map();
                    if (Array.isArray(data.items)) {
                        data.items.forEach(item => {
                            if (!item.date) return;
                            const dStr = item.date.split('T')[0];
                            if (!map.has(dStr)) map.set(dStr, { parashat: null, holidays: [] });
                            const entry = map.get(dStr);
                            const title = item.hebrew || item.title || '';
                            if (item.category === 'parashat') {
                                entry.parashat = TextHelper.sanitizeHebrew(title).replace(/^פרשת\s+/, '');
                            } else if (item.category === 'holiday') {
                                entry.holidays.push(TextHelper.sanitizeHebrew(title));
                            }
                        });
                    }
                    this.cache.set(key, map);
                    return map;
                } catch {
                    const empty = new Map();
                    this.cache.set(key, empty);
                    return empty;
                }
            },
            async getDayDetails(year, month, day) {
                let resObj = { hebrewDate: "", hebrewYear: "", hebrewMonthName: "", hebrewDayNum: 0 };
                try {
                    const url = `https://www.hebcal.com/converter?cfg=json&gy=${year}&gm=${month}&gd=${day}&g2h=1`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data && data.hebrew) {
                        resObj.hebrewDate = TextHelper.sanitizeHebrew(data.hebrew);
                        const parts = resObj.hebrewDate.split(' ');
                        resObj.hebrewYear = parts[parts.length - 1];
                        resObj.hebrewDayNum = parseInt(data.hd, 10) || 0;
                        resObj.hebrewMonthName = data.hm || "";
                    }
                } catch (e) {
                    console.error("Hebcal converter error:", e);
                }

                if (!resObj.hebrewDayNum || !resObj.hebrewMonthName) {
                    try {
                        const testD = new Date(year, month - 1, day);
                        const dFmt = new Intl.DateTimeFormat('en-US-u-ca-hebrew', { day: 'numeric', month: 'numeric' });
                        const parts = dFmt.formatToParts(testD);
                        const dPart = parts.find(p => p.type === 'day');
                        if (dPart) resObj.hebrewDayNum = parseInt(dPart.value, 10);
                        resObj.hebrewMonthName = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { month: 'long' }).format(testD);
                    } catch {}
                }
                return resObj;
            },
            async getSaturdayParasha(dateObj, dayIndex) {
                try {
                    const sat = new Date(dateObj);
                    sat.setDate(dateObj.getDate() + (6 - dayIndex));
                    const satY = sat.getFullYear();
                    const satM = sat.getMonth() + 1;
                    const satD = sat.getDate();
                    const satStr = `${satY}-${String(satM).padStart(2, '0')}-${String(satD).padStart(2, '0')}`;
                    const url = `https://www.hebcal.com/hebcal?v=1&cfg=json&gy=${satY}&gm=${satM}&s=on&geo=il&lg=he`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data && data.items) {
                        const satItems = data.items.filter(i => i.date === satStr);
                        const pItem = satItems.find(i => i.category === 'parashat');
                        const sItem = satItems.find(i => i.hebrew && i.hebrew.startsWith('שבת ') && !i.hebrew.includes('מבָרְכִים'));
                        
                        if (pItem) return TextHelper.formatParasha(pItem.hebrew.replace(/^פרשת\s+/, ''));
                        if (sItem) return TextHelper.formatParasha(sItem.hebrew.replace('שבת ', ''));
                    }
                } catch (err) {
                    console.error("Parasha fetch error:", err);
                }
                return "";
            }
        };

                        const d = parseInt(parts[0], 10);
                        const m = parseInt(parts[1], 10) - 1;
                        const y = parseInt(parts[2], 10);
                        const t = new Date(y, m, d);
                        if (t && t.getDate() === d && t.getMonth() === m) {

                document.getElementById('dateSelect').value = `${y}-${m}-${d}`;
                if (updateTypedInput) {
                    document.getElementById('typedDateInput').value = `${d}/${m}/${y}`;
                }
                this.render();
            },
            async render() {
                const currentId = ++this.renderId;
                const grid = document.getElementById('calGrid');
                const title = document.getElementById('calMonthYearTitle');

                const y = this.currentDate.getFullYear();
                const m = this.currentDate.getMonth();
                const monthNames = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
                title.textContent = `${monthNames[m]} ${y} | ${HebrewDateHelper.toMonth(new Date(y, m, 15))}`;

                const holidays = await HebcalService.getMonthHolidays(y, m);
                if (currentId !== this.renderId) return;

                grid.innerHTML = '';
                const firstDay = new Date(y, m, 1).getDay();
                const totalDays = new Date(y, m + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'cal-day empty';
                    grid.appendChild(empty);
                }

                const todayKey = this.formatDateKey(new Date());
                const fragment = document.createDocumentFragment();

                for (let d = 1; d <= totalDays; d++) {
                    const dObj = new Date(y, m, d);
                    const key = this.formatDateKey(dObj);
                    const isToday = key === todayKey;
                    const isSelected = this.selectedDate && key === this.formatDateKey(this.selectedDate);
                    const isShabbat = dObj.getDay() === 6;

                    const cell = document.createElement('div');
                    cell.className = 'cal-day border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:border-blue-500';
                    cell.dataset.day = String(d);
                    cell.dataset.month = String(m);
                    cell.dataset.year = String(y);

                    if (isToday) cell.classList.add('ring-2', 'ring-blue-500');
                    if (isShabbat) cell.classList.add('is-shabbat', 'bg-amber-50/40', 'dark:bg-amber-950/20');
                    if (isSelected) cell.classList.add('selected');

                    let badges = '';
                    const dayHols = holidays.get(key);
                    if (dayHols) {
                        if (dayHols.holidays?.length) {
                            dayHols.holidays.forEach(h => {
                                badges += `<div class="cal-holiday-pill bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 font-semibold" title="${h}">${h}</div>`;
                            });
                        }
                        if (isShabbat && dayHols.parashat) {
                            const p = TextHelper.formatParasha(dayHols.parashat);
                            badges += `<div class="cal-parasha-pill bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 font-bold" title="פרשת ${p}">פרשת ${p}</div>`;
                        }
                    }

                    cell.innerHTML = `
                        <div class="flex justify-between items-baseline w-full">
                            <span class="text-xs font-bold leading-none">${d}</span>
                            <span class="text-[11px] font-bold text-gray-500 dark:text-gray-400 leading-none">${HebrewDateHelper.toDay(dObj)}</span>
                        </div>
                        <div class="flex flex-col gap-0.5 w-full overflow-hidden mt-0.5">${badges}</div>`;
                    fragment.appendChild(cell);
                }
                grid.appendChild(fragment);
            }
        };

        function toggleQuickCopy() {
            const content = document.getElementById('quickCopyContent');
            const chevron = document.getElementById('quickCopyChevron');
            const isHidden = content.classList.contains('hidden');
            content.classList.toggle('hidden', !isHidden);
            chevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function renderQuickCopyButtons() {
            const container = document.getElementById('quickCopyButtonsContainer');
            const keys = ['qcDay1', 'qcDay2', 'qcDay3', 'qcDay4', 'qcDay5', 'qcErevShabbat', 'qcMotash'];
            container.innerHTML = keys.map(key => `
                <button onclick="ClipboardService.copyText(this.querySelector('span').innerText, 'quickCopyMsg')" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                    <span data-i18n="${key}"></span>
                    <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                </button>
            `).join('');
            I18nService.apply(I18nService.currentLang);
        }

        const AudioModule = {
            audio: document.getElementById('audioElement'),
            playIcon: document.getElementById('playIcon'),
            progressBar: document.getElementById('progressBar'),
            currentTimeDisplay: document.getElementById('currentTimeDisplay'),
            durationDisplay: document.getElementById('durationDisplay'),
            muteIcon: document.getElementById('muteIcon'),
            playingWaves: document.getElementById('playingWaves'),

            init() {
                this.audio.addEventListener('loadedmetadata', () => {
                    this.progressBar.max = this.audio.duration;
                    this.durationDisplay.innerText = this.formatTime(this.audio.duration);
                });
                this.audio.addEventListener('timeupdate', () => {
                    this.progressBar.value = this.audio.currentTime;
                    this.currentTimeDisplay.innerText = this.formatTime(this.audio.currentTime);
                    const pct = (this.audio.currentTime / this.audio.duration) * 100;
                    const bgLight = document.documentElement.classList.contains('dark') ? '#334155' : '#e2e8f0';
                    const bgFill = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
                    this.progressBar.style.background = `linear-gradient(to right, ${bgFill} ${pct}%, ${bgLight} ${pct}%)`;
                });
                this.progressBar.addEventListener('input', () => {
                    this.audio.currentTime = this.progressBar.value;
                    this.currentTimeDisplay.innerText = this.formatTime(this.progressBar.value);
                });
                this.audio.addEventListener('ended', () => {
                    this.playIcon.classList.replace('fa-pause', 'fa-play');
                    this.playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                    this.playingWaves.classList.add('opacity-0');
                    this.progressBar.value = 0;
                    this.audio.currentTime = 0;
                    this.progressBar.style.background = 'transparent';
                });
            },
            formatTime(sec) {
                if (isNaN(sec)) return "00:00";
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            },
            togglePlay() {
                if (this.audio.paused) {
                    this.audio.play();
                    this.playIcon.classList.replace('fa-play', 'fa-pause');
                    this.playIcon.classList.remove('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                    this.playingWaves.classList.remove('opacity-0');
                } else {
                    this.audio.pause();
                    this.playIcon.classList.replace('fa-pause', 'fa-play');
                    this.playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                    this.playingWaves.classList.add('opacity-0');
                }
            },
            toggleMute() {
                this.audio.muted = !this.audio.muted;
                if (this.audio.muted) {
                    this.muteIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
                    this.muteIcon.classList.add('text-red-500');
                } else {
                    this.muteIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
                    this.muteIcon.classList.remove('text-red-500');
                }
            },
            loadSource(fullLink) {
                document.getElementById('audioSource').src = fullLink;
                this.audio.load();
                document.getElementById('playerPanel').classList.remove('hidden');
                this.playIcon.classList.replace('fa-pause', 'fa-play');
                this.playIcon.classList.add('ml-1', 'rtl:ml-0', 'rtl:mr-1');
                this.playingWaves.classList.add('opacity-0');
                this.progressBar.value = 0;
                this.progressBar.style.background = 'transparent';
                this.currentTimeDisplay.innerText = "00:00";
                this.durationDisplay.innerText = "--:--";
            }
        };

        // Main Link Generator
        async function generateLink() {
            const programSelect = document.getElementById('programSelect').value;
            const dateVal = document.getElementById('dateSelect').value;
            const partVal = document.getElementById('partSelect').value.trim().toLowerCase();
            const btn = document.getElementById('generateBtn');
            const originalHtml = btn.innerHTML;
            
            if (!programSelect) return alert(i18n[I18nService.currentLang].alertNoProgram);
            if (!dateVal) return alert(i18n[I18nService.currentLang].alertNoDate);

            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${i18n[I18nService.currentLang].generateLinkLoading}</span>`;
            btn.disabled = true;

            try {
                const programData = JSON.parse(programSelect);
                const [year, month, day] = dateVal.split('-');
                const yInt = parseInt(year, 10), mInt = parseInt(month, 10), dInt = parseInt(day, 10);
                const dateObj = new Date(yInt, mInt - 1, dInt);
                const dayIndex = dateObj.getDay();

                const fileYear = programData.yearLen === 2 ? year.slice(-2) : year;
                const baseFileName = `${programData.prefix}${day}-${month}-${fileYear}${partVal}`;
                const relativeLink = `/upload/mp3/${programData.type}/${programData.folder}/${year}/${month}/${baseFileName}.mp3`;
                const fullLink = `https://media.kcm.fm${relativeLink}`;

                const [hDetails, parashaName] = await Promise.all([
                    HebcalService.getDayDetails(yInt, mInt, dInt),
                    HebcalService.getSaturdayParasha(dateObj, dayIndex)
                ]);

                const daysPrefixes = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "ערב שבת", "מוצאי שבת"];
                const dayName = daysPrefixes[dayIndex];
                const hDay = hDetails.hebrewDayNum;
                const hMonth = hDetails.hebrewMonthName;
                const hYear = hDetails.hebrewYear;

                let specialTitle = "";
                let isErevChag = false;
                let isCholHamoed = false;
                let cholHamoedDayNum = 0;
                let cholHamoedHolidayName = "";

                if (hMonth.includes('תשרי') || hMonth.includes('Tishrei')) {
                    if (hDay >= 11 && hDay <= 14) {
                        specialTitle = "ערב חג סוכות";
                        isErevChag = true;
                    } else if (hDay >= 16 && hDay <= 21) {
                        isCholHamoed = true;
                        cholHamoedDayNum = hDay - 15;
                        cholHamoedHolidayName = "סוכות";
                    } else if (hDay === 22) {
                        specialTitle = "שמחת תורה";
                    }
                } else if (hMonth.includes('אלול') || hMonth.includes('Elul')) {
                    if (hDay === 29) {
                        specialTitle = "ערב ראש השנה";
                        isErevChag = true;
                    }
                } else if (hMonth.includes('ניסן') || hMonth.includes('Nisan')) {
                    if (hDay >= 11 && hDay <= 14) {
                        specialTitle = "ערב חג הפסח";
                        isErevChag = true;
                    } else if (hDay >= 16 && hDay <= 20) {
                        isCholHamoed = true;
                        cholHamoedDayNum = hDay - 15;
                        cholHamoedHolidayName = "פסח";
                    }
                }

                let finalDayStr = "";

                // 1. קובי סלע
                if (programData.folder === 'Kobi_Sela') {
                    finalDayStr = `מצעד שירים במעלות עם קובי סלע ${day}.${month}.${year.slice(-2)}`;
                }
                // 2. מני גרא (שוורץ)
                else if (programData.folder === 'meni_shwartz') {
                    const shortHebrewYear = hYear ? hYear.replace(/^תש/, '') : '';
                    
                    let pDisplay = parashaName ? TextHelper.formatParasha(parashaName) : "";
                    if ((hMonth.includes('תשרי') || hMonth.includes('Tishrei')) && (hDay >= 3 && hDay <= 9) && pDisplay.includes('האזינו')) {
                        pDisplay = "האזינו-שובה";
                    }

                    if (isErevChag) {
                        let chagName = specialTitle.replace(/^ערב\s+/, '');
                        if (partVal === 'a') {
                            finalDayStr = `${chagName} ${shortHebrewYear}: שעה ראשונה - מוזיקה קצבית`;
                        } else if (partVal === 'b') {
                            finalDayStr = `${chagName} ${shortHebrewYear}: שעה שניה - פרשת השבוע ווארטים`;
                        } else {
                            finalDayStr = `${specialTitle} ${hYear}`;
                        }
                    } else {
                        if (partVal === 'a') {
                            finalDayStr = `${pDisplay} ${shortHebrewYear}: שעה ראשונה - מוזיקה קצבית`;
                        } else if (partVal === 'b') {
                            finalDayStr = `${pDisplay} ${shortHebrewYear}: שעה שניה - פרשת השבוע ווארטים`;
                        } else {
                            finalDayStr = `${dayName} פרשת ${pDisplay} ${hYear}`;
                        }
                    }
                }
                // 3. כל שאר התוכניות
                else {
                    if (isErevChag) {
                        if (dayIndex === 5) {
                            const cleanChag = specialTitle.replace(/^ערב\s+/, '');
                            finalDayStr = `ערב שבת ו${cleanChag} ${hYear}`;
                        } else {
                            finalDayStr = `${dayName} ${specialTitle} ${hYear}`;
                        }
                    } else if (isCholHamoed) {
                        const dayLetters = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו'];
                        const dayHebLetter = dayLetters[cholHamoedDayNum] || '';
                        if (dayIndex === 6) {
                            finalDayStr = `שבת חול המועד ${cholHamoedHolidayName} ${hYear}`;
                        } else if (hDay === 21 && (hMonth.includes('תשרי') || hMonth.includes('Tishrei'))) {
                            finalDayStr = `${dayName} הושענא רבה ${hYear}`;
                        } else {
                            finalDayStr = `${dayName} ${dayHebLetter}' דחול המועד ${cholHamoedHolidayName} ${hYear}`;
                        }
                    } else {
                        let pDisplay = parashaName ? TextHelper.formatParasha(parashaName) : "";
                        if ((hMonth.includes('תשרי') || hMonth.includes('Tishrei')) && (hDay >= 23 && hDay <= 29)) {
                            pDisplay = "בראשית";
                        }
                        finalDayStr = dayName + (pDisplay ? ` פרשת ${pDisplay}` : "") + (hYear ? ` ${hYear}` : "");
                    }
                }

                // עדכון שדות פלט
                document.getElementById('output').value = relativeLink;
                document.getElementById('fileNameOutput').value = baseFileName;
                document.getElementById('combinedDateOutput').value = finalDayStr;
                document.getElementById('openLinkBtn').href = fullLink;
                document.getElementById('resultArea').classList.remove('hidden');

                ['copyMsg', 'copyFileNameMsg', 'copyCombinedDateMsg'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });

                AudioModule.loadSource(fullLink);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        function initLogger() {
            setTimeout(async () => {
                try {
                    const baseUrl = 'https://script.google.com/macros/s/AKfycbyHnFlvSHKDgBJ2Kbw-3320YHwuwHH2PqABojHyt22pYPe4B7Sek6meB_XDRnp0VEIXwg/exec';
                    let userIP = 'לא ידוע';
                    try {
                        const ipRes = await fetch('https://api.ipify.org?format=json');
                        const ipData = await ipRes.json();
                        userIP = ipData.ip;
                    } catch {}

                    const fullUrl = `${baseUrl}?sheet=ELINK&action=page_view&ip=${encodeURIComponent(userIP)}&userAgent=${encodeURIComponent(navigator.userAgent)}`;
                    fetch(fullUrl, { method: 'POST', mode: 'no-cors' }).catch(() => {});
                } catch {}
            }, 1500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            ThemeService.init();
            ReorderModal.init();
            I18nService.init();
            renderQuickCopyButtons();
            AudioModule.init();
            CustomCalendar.init();
            initLogger();
        });
    </script>
