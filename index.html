<!DOCTYPE html>
<html lang="he" dir="rtl" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINK - מחולל קישורים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .dark input[type=range]::-webkit-slider-thumb {
            background: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #334155;
        }
        
        .play-btn-transition {
            transition: all 0.2s ease-in-out;
        }
        .play-btn-transition:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-gray-900 transition-colors duration-300 relative">

    <!-- כפתורי פעולה עליונים (מצב כהה ושפה) -->
    <div class="absolute top-4 w-full max-w-7xl px-4 flex justify-between left-1/2 -translate-x-1/2 z-10">
        <button onclick="toggleTheme()" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-yellow-400 hover:scale-110 transition-transform focus:outline-none" data-i18n-title="themeToggle">
            <i id="themeIcon" class="fas fa-moon text-xl"></i>
        </button>
        
        <button onclick="toggleLanguage()" class="py-2 px-4 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-800 dark:text-gray-200 hover:scale-105 transition-transform focus:outline-none font-bold text-sm flex items-center gap-2">
            <i class="fas fa-globe"></i>
            <span id="langBtnText">English</span>
        </button>
    </div>

    <!-- המכולה הראשית -->
    <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full max-w-5xl mt-16 lg:mt-10">
        
        <!-- חלונית הטופס -->
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full lg:max-w-lg transition-colors duration-300">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight" data-i18n="appTitle">ELINK</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-2 font-medium" data-i18n="appSubtitle">מחולל הקישורים החכם</p>
            </div>

            <div class="space-y-5">
                <!-- בחירת תוכנית -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectProgramLabel">בחר תוכנית:</label>
                    <div class="flex gap-2">
                        <select id="programSelect" class="flex-1 w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        </select>
                        <button onclick="openReorderModal()" class="px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500" data-i18n-title="editOrderBtnTitle" title="שנה סדר רשימה">
                            <i class="fas fa-sort-amount-down"></i>
                        </button>
                    </div>
                </div>

                <!-- בחירת תאריך -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="dateSelect" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="selectDateLabel">בחר תאריך:</label>
                        <input type="date" id="dateSelect" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label for="partSelect" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="partOptionalLabel">חלק (אופציונלי):</label>
                        <input type="text" id="partSelect" placeholder="למשל: a או b" data-i18n-placeholder="partPlaceholder" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <!-- כפתור יצירה -->
                <button id="generateBtn" onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
                    <i class="fas fa-link"></i> <span data-i18n="generateLinkBtn">הפק קישור</span>
                </button>

                <!-- אזור תוצאה -->
                <div id="resultArea" class="hidden mt-6 space-y-4">
                    
                    <!-- שדה לינק מלא -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedLinkLabel">הקישור שהופק:</label>
                        <div class="relative">
                            <textarea id="output" readonly class="w-full pl-12 pr-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm h-20 resize-none focus:outline-none transition-colors" dir="ltr"></textarea>
                            
                            <div class="absolute top-3 left-3 flex flex-col gap-2">
                                <button onclick="copyToClipboard()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyLinkTitle" title="העתק קישור">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                                <a id="openLinkBtn" href="#" target="_blank" class="text-gray-500 dark:text-gray-400 hover:text-green-600 dark:hover:text-green-400 transition-colors" data-i18n-title="openNewTabTitle" title="פתח בטאב חדש">
                                    <i class="fas fa-external-link-alt text-xl"></i>
                                </a>
                            </div>
                        </div>
                        <div id="copyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-1 hidden text-center" data-i18n="copySuccessMsg">הקישור הועתק בהצלחה!</div>
                    </div>

                    <!-- שדה שם קובץ -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedFileNameLabel">שם הקובץ:</label>
                        <div class="relative">
                            <input type="text" id="fileNameOutput" readonly class="w-full pl-12 pr-4 py-2.5 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-left font-mono text-sm focus:outline-none transition-colors" dir="ltr">
                            
                            <div class="absolute top-2.5 left-3 flex flex-col gap-2">
                                <button onclick="copyFileNameToClipboard()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyFileNameTitle" title="העתק שם קובץ">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyFileNameMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-1 hidden text-center" data-i18n="copyFileNameSuccessMsg">שם הקובץ הועתק בהצלחה!</div>
                    </div>

                    <!-- שדה יום, פרשה ותאריך בפורמט התמונה -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="fullTitleLabel">יום, פרשה ותאריך:</label>
                        <div class="relative">
                            <textarea id="fullFormattedTitleOutput" readonly rows="2" class="w-full pl-12 pr-4 py-2.5 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-right font-medium text-sm focus:outline-none resize-none transition-colors leading-relaxed" dir="rtl"></textarea>
                            
                            <div class="absolute top-2.5 left-3 flex flex-col gap-2">
                                <button onclick="copyFullFormattedTitleToClipboard()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyFullTitleTitle" title="העתק פורמט מלא">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyFullTitleMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-1 hidden text-center" data-i18n="copyFullTitleSuccessMsg">הפורמט המלא הועתק בהצלחה!</div>
                    </div>

                    <!-- שדה תאריך משולב רגיל -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1" data-i18n="generatedDateLabel">יום ותאריך רגיל:</label>
                        <div class="relative">
                            <input type="text" id="combinedDateOutput" readonly class="w-full pl-12 pr-4 py-2.5 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 text-right font-mono text-sm focus:outline-none transition-colors" dir="rtl">
                            
                            <div class="absolute top-2.5 left-3 flex flex-col gap-2">
                                <button onclick="copyCombinedDateToClipboard()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-i18n-title="copyDateTitle" title="העתק יום ותאריך">
                                    <i class="fas fa-copy text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div id="copyCombinedDateMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-1 hidden text-center" data-i18n="copyDateSuccessMsg">היום והתאריך הועתקו בהצלחה!</div>
                    </div>

                </div>
            </div>
            
            <div class="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs font-medium text-gray-400 dark:text-gray-500 italic tracking-wider">
                    Written specially for Eli from Monsey
                </p>
            </div>
        </div>

        <!-- עמודת פאנל צד (העתקה מהירה + נגן) -->
        <div class="flex flex-col gap-6 w-full lg:w-72 self-start">
            
            <!-- פאנל העתקה מהירה -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full transition-colors duration-300">
                <button onclick="toggleQuickCopy()" class="w-full flex justify-between items-center p-6 bg-transparent focus:outline-none group">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="quickCopyTitle">העתקה מהירה</h3>
                    <i id="quickCopyChevron" class="fas fa-chevron-down text-gray-500 dark:text-gray-400 transition-transform duration-300"></i>
                </button>
                
                <div id="quickCopyContent" class="hidden px-6 pb-6 pt-0 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex flex-col gap-3 mt-4">
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcDay1">יום ראשון</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcDay2">יום שני</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcDay3">יום שלישי</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcDay4">יום רביעי</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcDay5">יום חמישי</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcErevShabbat">ערב שבת פרשת</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                        <button onclick="copyQuickText(this)" class="w-full flex justify-between items-center px-4 py-3 bg-gray-50 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors text-gray-700 dark:text-gray-200 font-medium group text-sm">
                            <span data-i18n="qcMotash">מוצאי שבת פרשת</span>
                            <i class="fas fa-copy text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                        </button>
                    </div>
                    <div id="quickCopyMsg" class="text-green-600 dark:text-green-400 text-sm font-semibold mt-4 hidden text-center" data-i18n="quickCopySuccessMsg">הטקסט הועתק בהצלחה!</div>
                </div>
            </div>

            <!-- נגן שמע -->
            <div id="playerPanel" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full p-6 transition-colors duration-300 hidden">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-5 text-center border-b border-gray-200 dark:border-gray-700 pb-3" data-i18n="audioPlayerTitle">האזנה להקלטה</h3>
                
                <audio id="audioElement" preload="metadata">
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>

                <div class="flex flex-col items-center gap-4 mt-2">
                    <button id="playPauseBtn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg play-btn-transition focus:outline-none focus:ring-4 focus:ring-blue-500/50">
                        <i id="playIcon" class="fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1"></i>
                    </button>
                    
                    <div class="w-full flex flex-col gap-2">
                        <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full focus:outline-none">
                        
                        <div class="flex justify-between w-full text-xs font-semibold text-gray-500 dark:text-gray-400 font-mono" dir="ltr">
                            <span id="currentTimeDisplay">00:00</span>
                            <span id="durationDisplay">00:00</span>
                        </div>
                    </div>

                    <div class="w-full flex items-center justify-between mt-1">
                        <button onclick="toggleMute()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors focus:outline-none p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i id="muteIcon" class="fas fa-volume-up text-lg"></i>
                        </button>
                        
                        <div id="playingWaves" class="flex gap-1 items-end h-4 opacity-0 transition-opacity">
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite] h-full"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.2s] h-3/4"></div>
                            <div class="w-1 bg-blue-500 rounded-t-sm animate-[bounce_1s_infinite_0.4s] h-full"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Modal לסידור הרשימה -->
    <div id="reorderModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col transform scale-95 transition-transform duration-300" style="max-height: 85vh;">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="reorderTitle">סידור רשימת התוכניות</h3>
                <button onclick="closeReorderModal()" class="text-gray-400 hover:text-red-500 transition-colors focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar bg-gray-100 dark:bg-gray-900" id="reorderList">
            </div>
            
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-between gap-3 bg-white dark:bg-gray-800">
                <button onclick="resetOrder()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors border border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-400 dark:hover:border-blue-500" data-i18n="reorderResetBtn">שחזר ברירת מחדל</button>
                <div class="flex gap-2">
                    <button onclick="closeReorderModal()" class="px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg transition-colors" data-i18n="reorderCancelBtn">ביטול</button>
                    <button onclick="saveOrder()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-md" data-i18n="reorderSaveBtn">שמור שינויים</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. עזרי אחסון מקומי ---
        const safeStorage = {
            get(key, defaultVal) {
                try {
                    const val = localStorage.getItem(key);
                    return val !== null ? val : defaultVal;
                } catch {
                    return defaultVal;
                }
            },
            set(key, val) {
                try {
                    localStorage.setItem(key, val);
                } catch (e) {
                    console.warn('Storage set error:', e);
                }
            }
        };

        // --- 2. מסד נתוני התוכניות ---
        const programsData = [
            { id: "prog_Gil_Israelov", value: '{"type":"programs", "folder":"Gil_Israelov", "prefix":"Gil_Israelov", "yearLen":4}' },
            { id: "prog_Mendy_Weiss", value: '{"type":"programs", "folder":"Mendy_Weiss", "prefix":"Mendy_Weiss", "yearLen":4}' },
            { id: "prog_Avi_Ilson", value: '{"type":"programs", "folder":"Avi_Ilson", "prefix":"Avi_Ilson", "yearLen":2}' },
            { id: "prog_Hershey_Eisenbach", value: '{"type":"programs", "folder":"Hershey_Eisenbach", "prefix":"Hershey_Eisenbach", "yearLen":4}' },
            { id: "prog_Eli_Klein", value: '{"type":"programs", "folder":"Eli_Klein", "prefix":"Klein", "yearLen":4}' },
            { id: "prog_Yehuda_Galili", value: '{"type":"programs", "folder":"Yehuda_Galili", "prefix":"Yehuda_Galili", "yearLen":4}' },
            { id: "prog_Bardak", value: '{"type":"programs", "folder":"Bardak", "prefix":"Bardak", "yearLen":2}' },
            { id: "prog_Habama_Hamerkzit", value: '{"type":"programs", "folder":"Habama_Hamerkzit", "prefix":"Habama_Hamerkzit", "yearLen":2}' },
            { id: "prog_Kobi_Sela", value: '{"type":"programs", "folder":"Kobi_Sela", "prefix":"Kobis", "yearLen":2}' },
            { id: "prog_Yaron_Bar", value: '{"type":"programs", "folder":"Yaron_Bar", "prefix":"Yaron_Bar", "yearLen":4}' },
            { id: "prog_Ackerman", value: '{"type":"programs", "folder":"Ackerman", "prefix":"Ackerman", "yearLen":2}' },

        // ניקוי תווי ניקוד, טעמים וגרשיים מיוחדים מטקסט עברי
        function sanitizeHebrew(str) {
            if (!str) return '';
            return str
                .replace(/[\u0591-\u05C7]/g, '')
                .replace(/־/g, '-')
                .replace(/״/g, '"')
                .replace(/׳/g, "'")
                .trim();
        }

        // מנגנון העתקה מאוחד עם תמיכה בכל הדפדפנים והקשרים
        function copyText(text, msgElementId) {
            if (!text) return;

            const onDone = () => {
                const msg = document.getElementById(msgElementId);
                if (msg) {
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                }
            };

            const fallback = () => {
                const temp = document.createElement("textarea");
                temp.value = text;
                temp.style.position = "fixed";
                temp.style.opacity = "0";
                document.body.appendChild(temp);
                temp.focus();
                temp.select();
                try {
                    document.execCommand('copy');
                    onDone();
                } catch {
                    alert(i18n[currentLang].alertCopyFail);
                }
                document.body.removeChild(temp);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onDone).catch(fallback);
            } else {
                fallback();
            }
        }

        async function fetchHebrewDateAndParasha(year, month, day, dateObj, dayIndex) {
            let formattedHebrewDate = "";
            let hebrewYear = "";
            let parashaName = "";

            // 1. המרה ראשית דרך ה-Converter (מחזיר תאריך עברי ואירועי פרשה רלוונטיים ליום)
            try {
                const convUrl = `https://www.hebcal.com/converter?cfg=json&gy=${year}&gm=${parseInt(month, 10)}&gd=${parseInt(day, 10)}&g2h=1&lg=he-x-NoNikud`;
                const res = await fetch(convUrl);
                const convData = await res.json();

                if (convData) {
                    if (convData.hebrew) {
                        formattedHebrewDate = sanitizeHebrew(convData.hebrew);
                    }
                    if (convData.heDateParts?.y) {
                        hebrewYear = sanitizeHebrew(convData.heDateParts.y);
                    } else if (formattedHebrewDate) {
                        const parts = formattedHebrewDate.split(' ');
                        hebrewYear = parts[parts.length - 1];
                    }

                    if (Array.isArray(convData.events)) {
                        const pEvent = convData.events.find(e => e.includes('פרשת') || e.startsWith('שבת '));
                        if (pEvent) parashaName = sanitizeHebrew(pEvent);
                    }
                }
            } catch (err) {
                console.warn("Hebcal Converter error:", err);
            }

            // 2. גיבוי: שליפת הפרשה לפי שבת הקרובה של אותו השבוע אם עדיין לא זוהתה
            if (!parashaName) {
                try {
                    const saturday = new Date(dateObj);
                    saturday.setDate(dateObj.getDate() + (6 - dayIndex));
                    const satDateStr = `${saturday.getFullYear()}-${String(saturday.getMonth() + 1).padStart(2, '0')}-${String(saturday.getDate()).padStart(2, '0')}`;

                    const shabbatUrl = `https://www.hebcal.com/hebcal?v=1&cfg=json&s=on&i=on&start=${satDateStr}&end=${satDateStr}&lg=he`;
                    const sRes = await fetch(shabbatUrl);
                    const sData = await sRes.json();

                    if (Array.isArray(sData?.items)) {
                        const pItem = sData.items.find(i => i.category === 'parashat');
                        const sItem = sData.items.find(i => i.hebrew && i.hebrew.includes('שבת'));
                        const candidate = pItem?.hebrew || sItem?.hebrew;
                        if (candidate) parashaName = sanitizeHebrew(candidate);
                    }
                } catch (err) {
                    console.warn("Shabbat lookup fallback error:", err);
                }
            }

            if (parashaName && !parashaName.startsWith("פרשת ") && !parashaName.startsWith("שבת ")) {
                parashaName = "פרשת " + parashaName;
            }

            return { formattedHebrewDate, hebrewYear, parashaName };
        }

        window.generateLink = async function() {
            const programSelect = document.getElementById('programSelect');
            const dateSelect = document.getElementById('dateSelect');
            const partSelect = document.getElementById('partSelect');
            const btn = document.getElementById('generateBtn');

            if (!programSelect?.value) return alert(i18n[currentLang].alertNoProgram);
            if (!dateSelect?.value) return alert(i18n[currentLang].alertNoDate);

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${i18n[currentLang].generateLinkLoading}</span>`;
            btn.disabled = true;

            try {
                const programData = JSON.parse(programSelect.value);
                const [year, month, day] = dateSelect.value.split('-');
                const partVal = partSelect.value.trim().toLowerCase();
                const fileYear = programData.yearLen === 2 ? year.slice(-2) : year;

                const baseFileName = `${programData.prefix}${day}-${month}-${fileYear}${partVal}`;
                const fileNameWithExt = `${baseFileName}.mp3`;

                // חישוב יום בשבוע
                const dateObj = new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10));
                const dayIndex = dateObj.getDay();
                const dayNames = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "ערב שבת", "מוצאי שבת"];
                const dayName = dayNames[dayIndex];

                // שליפת תאריך עברי ופרשה
                const { formattedHebrewDate, hebrewYear, parashaName } = await fetchHebrewDateAndParasha(year, month, day, dateObj, dayIndex);

                // הרכבת פורמט תוכנית מלא
                const line1Parasha = parashaName ? ` ${parashaName}` : "";
                const line1Year = hebrewYear ? ` ${hebrewYear}` : "";
                const fullFormattedTitle = `${dayName}${line1Parasha}${line1Year}\n${formattedHebrewDate} / ${day}/${month}/${year}`.trim();

                // הרכבת יום ותאריך רגיל
                let displayDayName = dayName;
                if ((dayIndex === 5 || dayIndex === 6) && parashaName) {
                    displayDayName = `${dayName} ${parashaName}`;
                }
                const combinedDate = `${displayDayName} - ${formattedHebrewDate} / ${day}/${month}/${year}`;

                // הרכבת קישור מלא ויחסי
                const relativeLink = `/upload/mp3/${programData.type}/${programData.folder}/${year}/${month}/${fileNameWithExt}`;
                const fullLink = `https://media.kcm.fm${relativeLink}`;

                // עדכון שדות תצוגה
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.value = val;
                };

                setVal('output', relativeLink);
                setVal('fileNameOutput', baseFileName);
                setVal('fullFormattedTitleOutput', fullFormattedTitle);
                setVal('combinedDateOutput', combinedDate);

                const openLinkBtn = document.getElementById('openLinkBtn');
                if (openLinkBtn) openLinkBtn.href = fullLink;

                // עדכון והצגת הנגן
                audioPlayer.loadAudio(fullLink);

                // הצגת אזורי התוצאה והנגן
                document.getElementById('resultArea')?.classList.remove('hidden');
                document.getElementById('playerPanel')?.classList.remove('hidden');

                // איפוס חיוויי העתקה
                ['copyMsg', 'copyFileNameMsg', 'copyFullTitleMsg', 'copyCombinedDateMsg'].forEach(id => {
                    document.getElementById(id)?.classList.add('hidden');
                });
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        };

        const audioPlayer = (function() {
            const audio = document.getElementById('audioElement');
            const source = document.getElementById('audioSource');
            const playIcon = document.getElementById('playIcon');
            const progressBar = document.getElementById('progressBar');
            const curTimeDisplay = document.getElementById('currentTimeDisplay');
            const durDisplay = document.getElementById('durationDisplay');
            const waves = document.getElementById('playingWaves');
            const muteIcon = document.getElementById('muteIcon');

            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function updateProgressBackground() {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                const isDark = document.documentElement.classList.contains('dark');
                const fill = isDark ? '#60a5fa' : '#2563eb';
                const track = isDark ? '#334155' : '#e2e8f0';
                progressBar.style.background = `linear-gradient(to right, ${fill} ${pct}%, ${track} ${pct}%)`;
            }

            audio.addEventListener('loadedmetadata', () => {
                progressBar.max = audio.duration;
                if (durDisplay) durDisplay.innerText = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                progressBar.value = audio.currentTime;
                if (curTimeDisplay) curTimeDisplay.innerText = formatTime(audio.currentTime);
                updateProgressBackground();
            });

            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
                if (curTimeDisplay) curTimeDisplay.innerText = formatTime(progressBar.value);
            });

            audio.addEventListener('ended', () => {
                playIcon.className = 'fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1';
                waves.classList.add('opacity-0');
                progressBar.value = 0;
                progressBar.style.background = '';
            });

            return {
                loadAudio(url) {
                    if (source && audio) {
                        source.src = url;
                        audio.load();
                        playIcon.className = 'fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1';
                        waves.classList.add('opacity-0');
                        progressBar.value = 0;
                        if (curTimeDisplay) curTimeDisplay.innerText = "00:00";
                        if (durDisplay) durDisplay.innerText = "--:--";
                    }
                },
                togglePlay() {
                    if (audio.paused) {
                        audio.play();
                        playIcon.className = 'fas fa-pause text-2xl';
                        waves.classList.remove('opacity-0');
                    } else {
                        audio.pause();
                        playIcon.className = 'fas fa-play text-2xl ml-1 rtl:ml-0 rtl:mr-1';
                        waves.classList.add('opacity-0');
                    }
                },
                toggleMute() {
                    audio.muted = !audio.muted;
                    if (audio.muted) {
                        muteIcon.className = 'fas fa-volume-mute text-lg text-red-500';
                    } else {
                        muteIcon.className = 'fas fa-volume-up text-lg';
                    }
                }
            };
        })();

        window.togglePlay = audioPlayer.togglePlay;
        window.toggleMute = audioPlayer.toggleMute;

        initOrder();
        populateSelect();
        applyLanguage(currentLang);

        window.addEventListener('load', () => {
            setTimeout(async () => {
                try {
                    const baseUrl = 'https://script.google.com/macros/s/AKfycbyHnFlvSHKDgBJ2Kbw-3320YHwuwHH2PqABojHyt22pYPe4B7Sek6meB_XDRnp0VEIXwg/exec';
                    let userIP = 'לא ידוע';

                    try {
                        const ipResponse = await fetch('https://api.ipify.org?format=json');
                        const ipData = await ipResponse.json();
                        userIP = ipData.ip || 'לא ידוע';
                    } catch {}

                    const fullUrl = `${baseUrl}?sheet=ELINK&action=page_view&ip=${encodeURIComponent(userIP)}&userAgent=${encodeURIComponent(navigator.userAgent)}`;
                    fetch(fullUrl, { method: 'POST', mode: 'no-cors' }).catch(() => {});
                } catch (e) {
                    console.warn('Analytics logger warning:', e);
                }
            }, 1500);
        });
    </script>
</body>
</html>
